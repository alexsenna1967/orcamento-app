<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Orçamentos e Recibos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Modo Compatível) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-y-screen p-4">

    <!-- PAINEL DO ADMINISTRADOR (Visível apenas para o dono) -->
    <div id="admin-panel" class="hidden max-w-4xl mx-auto mb-6 bg-gray-900 text-amber-400 border-2 border-amber-400 p-4 rounded-lg shadow-lg">
        <h3 class="font-bold text-lg mb-2">Painel do Administrador (Exclusivo)</h3>
        <p class="text-sm text-gray-300 mb-2">Monitorização de utilizadores e métricas do sistema.</p>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-800 p-3 rounded border border-gray-700">
                <p class="text-xs text-gray-400">Total de Contas Registadas:</p>
                <p id="total-users" class="text-xl font-bold">A carregar...</p>
            </div>
            <div class="bg-gray-800 p-3 rounded border border-gray-700">
                <p class="text-xs text-gray-400">Estado da Sessão:</p>
                <p class="text-sm font-semibold text-green-400">Ativo como Administrador</p>
            </div>
        </div>
    </div>

    <!-- ECRÃ DE AUTENTICAÇÃO (Login / Registo) -->
    <div id="auth-screen" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-10">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Acesse o Gestor</h2>
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2">E-mail</label>
            <input type="email" id="email" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500" placeholder="seu_email@email.com">
        </div>
        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2">Senha</label>
            <input type="password" id="password" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500" placeholder="********">
        </div>
        <button onclick="fazerLogin()" class="w-full bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700 transition mb-3">Entrar</button>
        <button onclick="fazerRegistro()" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700 transition">Criar Conta Grátis (30 Dias)</button>
        <div id="auth-error" class="text-red-500 text-sm mt-3 text-center font-semibold"></div>
    </div>

    <!-- APLICAÇÃO COMPLETA DE ORÇAMENTOS -->
    <div id="app-content" class="hidden max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-2xl font-bold text-gray-800">Criador de Orçamentos</h1>
            <div>
                <span id="user-email-display" class="text-sm text-gray-600 mr-4"></span>
                <button onclick="fazerLogout()" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Sair</button>
            </div>
        </div>

        <!-- Formulário de Orçamento (Layout Original) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">Nome do Cliente</label>
                <input type="text" id="cliente-nome" class="w-full p-2 border rounded" placeholder="Nome do cliente">
            </div>
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-1">Data</label>
                <input type="date" id="orcamento-data" class="w-full p-2 border rounded">
            </div>
        </div>

        <!-- Tabela de Itens / Serviços -->
        <div class="mb-4">
            <h3 class="font-bold text-gray-700 mb-2">Serviços / Produtos</h3>
            <div id="servicos-container" class="space-y-2 mb-2">
                <!-- Os itens dinâmicos entram aqui -->
            </div>
            <button onclick="adicionarServico()" class="bg-gray-800 text-white px-4 py-2 rounded text-sm hover:bg-gray-700">+ Adicionar Item</button>
        </div>

        <!-- Total e Ações -->
        <div class="flex justify-between items-center border-t pt-4 mt-4">
            <div class="text-xl font-bold text-gray-800">
                Total: R$ <span id="valor-total">0.00</span>
            </div>
            <div class="space-x-2">
                <button onclick="salvarHistorico()" class="bg-emerald-600 text-white px-4 py-2 rounded hover:bg-emerald-700">Salvar no Histórico</button>
                <button onclick="gerarPDF()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Gerar PDF</button>
            </div>
        </div>
    </div>

    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCXf123456789...", // Substitua pela sua chave correta se necessário
            authDomain: "orcamento-app-bd066.firebaseapp.com",
            projectId: "orcamento-app-bd066",
            storageBucket: "orcamento-app-bd066.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const EMAIL_DONO = "brazsenna67@gmail.com";

        // Controlo de Sessão
        auth.onAuthStateChanged(function(user) {
            if (user) {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                document.getElementById('user-email-display').innerText = user.email;

                if (user.email === EMAIL_DONO) {
                    document.getElementById('admin-panel').classList.remove('hidden');
                    carregarDadosAdmin();
                } else {
                    document.getElementById('admin-panel').classList.add('hidden');
                }
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-content').classList.add('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        // Funções de Autenticação
        function fazerRegistro() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!email || !password) {
                document.getElementById('auth-error').innerText = "Preencha o e-mail e a senha.";
                return;
            }

            document.getElementById('auth-error').innerText = "A criar conta...";

            auth.createUserWithEmailAndPassword(email, password)
                .then(function(userCredential) {
                    const user = userCredential.user;
                    return db.collection('users').doc(user.uid).set({
                        email: user.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        approved: true
                    });
                })
                .then(function() {
                    document.getElementById('auth-error').innerText = "";
                })
                .catch(function(err) {
                    document.getElementById('auth-error').innerText = "Erro: " + err.message;
                });
        }

        function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                document.getElementById('auth-error').innerText = "Preencha o e-mail e a senha.";
                return;
            }

            document.getElementById('auth-error').innerText = "A entrar...";

            auth.signInWithEmailAndPassword(email, password)
                .then(function() {
                    document.getElementById('auth-error').innerText = "";
                })
                .catch(function(err) {
                    document.getElementById('auth-error').innerText = "Erro ao entrar: " + err.message;
                });
        }

        function fazerLogout() {
            auth.signOut();
        }

        // Função do Painel Admin
        function carregarDadosAdmin() {
            db.collection('users').get().then(function(querySnapshot) {
                document.getElementById('total-users').innerText = querySnapshot.size;
            }).catch(function() {
                document.getElementById('total-users').innerText = "Erro ao carregar";
            });
        }

        // Funções de Orçamento (Exemplo base)
        function adicionarServico() {
            const container = document.getElementById('servicos-container');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center";
            div.innerHTML = `
                <input type="text" placeholder="Descrição do serviço" class="flex-1 p-2 border rounded desc-servico">
                <input type="number" placeholder="Valor (R$)" class="w-32 p-2 border rounded val-servico" oninput="calcularTotal()">
                <button onclick="this.parentElement.remove(); calcularTotal()" class="bg-red-500 text-white px-3 py-2 rounded">X</button>
            `;
            container.appendChild(div);
        }

        function calcularTotal() {
            let total = 0;
            document.querySelectorAll('.val-servico').forEach(input => {
                const val = parseFloat(input.value) || 0;
                total += val;
            });
            document.getElementById('valor-total').innerText = total.toFixed(2);
        }

        function salvarHistorico() {
            alert("Orçamento guardado com sucesso!");
        }

        function gerarPDF() {
            window.print();
        }
    </script>
</body>
</html>
