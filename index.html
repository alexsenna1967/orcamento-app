<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Orçamentos</title>
  
  <!-- Configurações para PWA (Aplicação Instalável) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">

  <!-- Estilos Visuais e Modo Escuro -->
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --border-color: #e5e7eb;
      --primary-color: #2563eb;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f3f4f6;
      --border-color: #374151;
      --primary-color: #3b82f6;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      border: 1px solid var(--border-color);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    button.btn-theme {
      padding: 8px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background-color: var(--card-bg);
      color: var(--text-color);
      box-sizing: border-box;
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: var(--bg-color);
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-bar">
      <h2>Orçamento App</h2>
      <button class="btn-theme" id="btn-theme" onclick="toggleDarkMode()">🌙 Modo Escuro</button>
    </div>

    <div class="form-group">
      <label for="valorHora">Valor por Hora (€):</label>
      <input type="number" id="valorHora" placeholder="Ex: 25" oninput="calcularTotal()">
    </div>

    <div class="form-group">
      <label for="horasEstimadas">Horas Estimadas:</label>
      <input type="number" id="horasEstimadas" placeholder="Ex: 10" oninput="calcularTotal()">
    </div>

    <div class="form-group">
      <label for="desconto">Desconto (%):</label>
      <input type="number" id="desconto" placeholder="Ex: 5" value="0" oninput="calcularTotal()">
    </div>

    <div class="result-box">
      <h3>Total Estimado: <span id="resultadoTotal">0.00</span> €</h3>
    </div>
  </div>

  <script>
    // Lógica do Cálculo de Orçamento
    function calcularTotal() {
      const valorHora = parseFloat(document.getElementById('valorHora').value) || 0;
      const horas = parseFloat(document.getElementById('horasEstimadas').value) || 0;
      const desconto = parseFloat(document.getElementById('desconto').value) || 0;

      let subtotal = valorHora * horas;
      let total = subtotal - (subtotal * (desconto / 100));

      document.getElementById('resultadoTotal').innerText = total.toFixed(2);
    }

    // Lógica do Modo Escuro
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('btn-theme').innerText = isDark ? '☀️ Modo Claro' : '🌙 Modo Escuro';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      document.getElementById('btn-theme').innerText = '☀️ Modo Claro';
    }

    // Registo do PWA (Service Worker)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('Service Worker Registado!'))
          .catch(err => console.log('Erro no Service Worker:', err));
      });
    }
  </script>
</body>
</html>
