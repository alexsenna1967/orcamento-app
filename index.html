<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Orçamentos - PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #1e1e1e;
      padding: 25px;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    h2 { margin-top: 0; color: #4caf50; }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #4caf50;
      border: none;
      color: white;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #45a049; }
    .hidden { display: none; }
    .status-msg { margin-top: 15px; font-size: 0.9em; color: #ff9800; }
    .btn-whatsapp { background-color: #25d366; text-decoration: none; display: block; text-align: center; padding: 12px; color: white; border-radius: 5px; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Formulário de Autenticação -->
    <div id="auth-section">
      <h2 id="form-title">Aceder à Calculadora</h2>
      <input type="email" id="email" placeholder="Seu e-mail" required>
      <input type="password" id="password" placeholder="Sua senha" required>
      
      <button id="btn-login" onclick="fazerLogin()">Entrar</button>
      <button id="btn-register" onclick="fazerRegistro()" style="background-color: #2196f3;">Criar Conta Gratis (30 Dias)</button>
      <p id="auth-error" class="status-msg"></p>
    </div>

    <!-- Área Principal do App (Calculadora) -->
    <div id="app-section" class="hidden">
      <h2>Calculadora Ativa</h2>
      <p>Bem-vindo! O seu período de teste está ativo.</p>
      <p id="trial-info" style="color: #4caf50; font-weight: bold;"></p>
      
      <!-- Aqui entra a lógica de cálculos do teu orçamento -->
      <hr>
      <button onclick="fazerLogout()" style="background-color: #f44336;">Sair</button>
    </div>

    <!-- Tela de Bloqueio por Expiração -->
    <div id="expired-section" class="hidden">
      <h2 style="color: #f44336;">Período de Teste Expirado</h2>
      <p>Os seus 30 dias de teste gratuito terminaram. Para continuar a utilizar e renovar a sua subscrição, entre em contacto connosco.</p>
      <a id="whatsapp-link" href="#" target="_blank" class="btn-whatsapp">Renovar via WhatsApp</a>
      <button onclick="fazerLogout()" style="background-color: #555; margin-top: 15px;">Sair / Alternar Conta</button>
    </div>
  </div>

  <!-- Scripts do Firebase (SDK v9 Modular em compatibilidade Web) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Configuração do Firebase (Substitua com as suas chaves do Firebase Console)
    const firebaseConfig = {
      apiKey: "// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAMtufmBKrbAUjzvWVZPswOnQpSq_EuB_Y",
  authDomain: "orcamento-app-bd066.firebaseapp.com",
  projectId: "orcamento-app-bd066",
  storageBucket: "orcamento-app-bd066.firebasestorage.app",
  messagingSenderId: "1084353732196",
  appId: "1:1084353732196:web:50ad6a30539b8a622a0971",
  measurementId: "G-QH9HG5N1FX"
};",
      authDomain: "orcamento-app.firebaseapp.com",
      projectId: "orcamento-app",
      storageBucket: "orcamento-app.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    // Inicializa o Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Monitora o estado de Login em tempo real
    auth.onAuthStateChanged(user => {
      if (user) {
        verificarStatusAssinatura(user);
      } else {
        mostrarTela('auth');
      }
    });

    // Função de Registo de Novo Utilizador
    function fazerRegistro() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          // Grava a data inicial no Firestore (30 dias de trial)
          return db.collection('users').doc(user.uid).set({
            email: user.email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            trialStartDate: new Date().toISOString(),
            approved: true // trial ativo por padrão
          });
        })
        .catch((error) => {
          document.getElementById('auth-error').innerText = "Erro ao registar: " + error.message;
        });
    }

    // Função de Login
    function fazerLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.signInWithEmailAndPassword(email, password)
        .catch((error) => {
          document.getElementById('auth-error').innerText = "Erro ao entrar: " + error.message;
        });
    }

    // Função de Logout
    function fazerLogout() {
      auth.signOut();
    }

    // Lógica principal de validação dos 30 dias de teste
    function verificarStatusAssinatura(user) {
      db.collection('users').doc(user.uid).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const startDate = new Date(data.trialStartDate);
          const currentDate = new Date();
          
          // Calcula a diferença em dias
          const diffTime = Math.abs(currentDate - startDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          const diasRestantes = 30 - diffDays;

          if (diffDays <= 30 && data.approved !== false) {
            document.getElementById('trial-info').innerText = `Período de teste: restam ${diasRestantes > 0 ? diasRestantes : 0} dia(s).`;
            mostrarTela('app');
          } else {
            // Configura link do WhatsApp com mensagem personalizada
            const numWhatsApp = "5531994110075"; // Coloque seu número do WhatsApp aqui
            const mensagem = encodeURIComponent(`Olá! O meu período de teste expirou (E-mail: ${user.email}). Gostaria de renovar o meu acesso à Calculadora.`);
            document.getElementById('whatsapp-link').href = `https://wa.me/${numWhatsApp}?text=${mensagem}`;
            mostrarTela('expired');
          }
        } else {
          mostrarTela('auth');
        }
      });
    }

    // Utilitário para alternar exibições de telas
    function mostrarTela(tela) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('expired-section').classList.add('hidden');

      if (tela === 'auth') document.getElementById('auth-section').classList.remove('hidden');
      if (tela === 'app') document.getElementById('app-section').classList.remove('hidden');
      if (tela === 'expired') document.getElementById('expired-section').classList.remove('hidden');
    }
  </script>
</body>
</html>
