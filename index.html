<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Orçamentos e Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para Gerar PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- 1. TELA DE LOGIN / REGISTRO -->
  <div id="auth-section" class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">Acesse o Sistema</h2>
    <div id="auth-error" class="text-red-500 text-sm mb-4 text-center"></div>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">E-mail</label>
        <input type="email" id="email" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" placeholder="seu@email.com">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Senha</label>
        <input type="password" id="password" class="w-full mt-1 p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none" placeholder="******">
      </div>
      
      <button onclick="fazerLogin()" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 transition font-bold">Entrar</button>
      <button onclick="fazerRegistro()" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 transition font-bold">Criar Conta Grátis (30 Dias)</button>
    </div>
  </div>

  <!-- 2. TELA DA APLICAÇÃO COMPLETA -->
  <div id="app-section" class="hidden bg-white p-8 rounded-xl shadow-md w-full max-w-2xl">
    
    <!-- Topo / Cabeçalho -->
    <div class="flex justify-between items-center mb-4 border-b pb-4">
      <div>
        <h1 id="displayEmpresa" class="text-2xl font-bold text-gray-800">Sua Empresa</h1>
        <p class="text-xs text-gray-500">Sistema de Orçamentos e Cobranças</p>
      </div>
      <button onclick="fazerLogout()" class="text-sm text-red-500 hover:underline">Sair</button>
    </div>

    <!-- Aviso do Período de Teste -->
    <div id="trial-info" class="bg-blue-50 text-blue-700 p-3 rounded-md mb-6 text-sm text-center font-medium"></div>

    <div id="area-pdf" class="space-y-6 p-2">
      <!-- Bloco 1: Dados da Empresa do Utilizador e do Cliente -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Nome da Sua Empresa</label>
          <input type="text" id="nomeEmpresa" oninput="atualizarEmpresa()" class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: Senna Serviços Web">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Nome do Cliente</label>
          <input type="text" id="nomeCliente" class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: João Silva">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">WhatsApp do Cliente (com DDD)</label>
          <input type="text" id="whatsCliente" class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: 31999999999">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Tipo / Status de Pagamento</label>
          <select id="statusPagamento" class="w-full mt-1 p-2 border rounded-md bg-white">
            <option value="Orçamento">Orçamento (Proposta)</option>
            <option value="Mensalista">Pagamento Mensalista</option>
            <option value="Pago Parcial">Pago Parcial</option>
            <option value="Pago Integral (Quitado)">Pago Integral (Quitado)</option>
          </select>
        </div>
      </div>

      <hr>

      <!-- Bloco 2: Lista de Serviços e Valores -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">Itens / Serviços</label>
        <div id="lista-itens" class="space-y-3">
          <div class="flex gap-2 item-row">
            <input type="text" placeholder="Descrição do serviço" class="nome-item w-2/3 p-2 border rounded-md">
            <input type="number" oninput="calcularOrcamento()" placeholder="Valor R$" class="valor-item w-1/3 p-2 border rounded-md">
          </div>
        </div>
        <button onclick="adicionarLinha()" class="mt-3 w-full bg-gray-200 text-gray-800 py-1.5 rounded-md hover:bg-gray-300 text-sm font-bold">+ Adicionar Item</button>
      </div>

      <!-- Bloco 3: Desconto e Totais -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
        <div>
          <label class="block text-sm font-medium text-gray-700">Desconto (%)</label>
          <input type="number" id="desconto" oninput="calcularOrcamento()" class="w-full mt-1 p-2 border rounded-md" placeholder="Ex: 5">
        </div>
        <div class="bg-gray-50 p-4 rounded-md border text-right">
          <span class="text-gray-600 font-medium text-sm block">Total Estimado:</span>
          <span id="resultado" class="text-2xl font-bold text-gray-800">R$ 0,00</span>
        </div>
      </div>
    </div>

    <!-- Bloco 4: Ações (PDF e WhatsApp) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6 pt-4 border-t">
      <button onclick="gerarPDF()" class="w-full bg-red-600 text-white py-2.5 rounded-md hover:bg-red-700 transition font-bold flex items-center justify-center gap-2">
        📄 Gerar PDF
      </button>
      <button onclick="enviarWhatsAppCliente()" class="w-full bg-green-600 text-white py-2.5 rounded-md hover:bg-green-700 transition font-bold flex items-center justify-center gap-2">
        💬 Enviar no WhatsApp
      </button>
    </div>
  </div>

  <!-- 3. TELA DE ACESSO EXPIRADO -->
  <div id="expired-section" class="hidden bg-white p-8 rounded-xl shadow-md w-full max-w-md text-center">
    <h2 class="text-2xl font-bold text-red-600 mb-4">Período de Teste Expirado</h2>
    <p class="text-gray-600 mb-6">Seus 30 dias de teste grátis terminaram. Para continuar utilizando a calculadora, entre em contato para renovar sua assinatura.</p>
    <a id="whatsapp-link" target="_blank" class="inline-block bg-green-500 text-white px-6 py-3 rounded-md font-bold hover:bg-green-600 transition">Renovar Acesso no WhatsApp</a>
    <br>
    <button onclick="fazerLogout()" class="mt-4 text-sm text-gray-500 underline">Voltar ao Login</button>
  </div>

  <script>
    // Configuração do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAMtufmBKrbAUjzvWVZPswOnQpSq_EuB_Y",
      authDomain: "orcamento-app-bd066.firebaseapp.com",
      projectId: "orcamento-app-bd066",
      storageBucket: "orcamento-app-bd066.firebasestorage.app",
      messagingSenderId: "1084353732196",
      appId: "1:1084353732196:web:50ad6a30539b8a622a0971",
      measurementId: "G-QH9HG5N1FX"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if (user) {
        verificarStatusAssinatura(user);
      } else {
        mostrarTela('auth');
      }
    });

    function fazerRegistro() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.createUserWithEmailAndPassword(email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          return db.collection('users').doc(user.uid).set({
            email: user.email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            trialStartDate: new Date().toISOString(),
            approved: true
          });
        })
        .catch((error) => {
          document.getElementById('auth-error').innerText = "Erro ao registrar: " + error.message;
        });
    }

    function fazerLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      auth.signInWithEmailAndPassword(email, password)
        .catch((error) => {
          document.getElementById('auth-error').innerText = "Erro ao entrar: " + error.message;
        });
    }

    function fazerLogout() {
      auth.signOut();
    }

    function verificarStatusAssinatura(user) {
      db.collection('users').doc(user.uid).get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          const startDate = new Date(data.trialStartDate);
          const currentDate = new Date();
          
          const diffTime = Math.abs(currentDate - startDate);
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          const diasRestantes = 30 - diffDays;

          if (diffDays <= 30 && data.approved !== false) {
            document.getElementById('trial-info').innerText = `Período de teste: restam ${diasRestantes > 0 ? diasRestantes : 0} dia(s).`;
            mostrarTela('app');
          } else {
            const numWhatsApp = "5531994110075"; 
            const mensagem = encodeURIComponent(`Olá! Meu período de teste expirou (E-mail: ${user.email}). Gostaria de renovar meu acesso.`);
            document.getElementById('whatsapp-link').href = `https://wa.me/${numWhatsApp}?text=${mensagem}`;
            mostrarTela('expired');
          }
        } else {
          mostrarTela('auth');
        }
      });
    }

    function atualizarEmpresa() {
      const nome = document.getElementById('nomeEmpresa').value;
      document.getElementById('displayEmpresa').innerText = nome.trim() !== "" ? nome : "Sua Empresa";
    }

    function adicionarLinha() {
      const container = document.getElementById('lista-itens');
      const novaLinha = document.createElement('div');
      novaLinha.className = 'flex gap-2 item-row mt-2';
      novaLinha.innerHTML = `
        <input type="text" placeholder="Descrição do serviço" class="nome-item w-2/3 p-2 border rounded-md">
        <input type="number" oninput="calcularOrcamento()" placeholder="Valor R$" class="valor-item w-1/3 p-2 border rounded-md">
      `;
      container.appendChild(novaLinha);
    }

    function calcularOrcamento() {
      const valores = document.querySelectorAll('.valor-item');
      let subtotal = 0;

      valores.forEach(input => {
        subtotal += parseFloat(input.value) || 0;
      });

      const desconto = parseFloat(document.getElementById('desconto').value) || 0;
      let total = subtotal;

      if (desconto > 0) {
        total = total - (total * (desconto / 100));
      }

      document.getElementById('resultado').innerText = total.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function enviarWhatsAppCliente() {
      const empresa = document.getElementById('nomeEmpresa').value || "Sua Empresa";
      const cliente = document.getElementById('nomeCliente').value || "Cliente";
      const whats = document.getElementById('whatsCliente').value;
      const status = document.getElementById('statusPagamento').value;
      
      if (!whats) {
        alert("Por favor, informe o WhatsApp do cliente.");
        return;
      }

      const nomes = document.querySelectorAll('.nome-item');
      const valores = document.querySelectorAll('.valor-item');
      
      let resumoItens = "";
      nomes.forEach((input, index) => {
        const nome = input.value || "Serviço";
        const val = parseFloat(valores[index].value) || 0;
        resumoItens += `• ${nome}: R$ ${val.toFixed(2)}\n`;
      });

      const totalFormatado = document.getElementById('resultado').innerText;

      const texto = `*${empresa}*\n` +
                    `Olá ${cliente}!\n\n` +
                    `*Status:* ${status}\n\n` +
                    `*Itens:*\n${resumoItens}\n` +
                    `*Total: ${totalFormatado}*\n\n` +
                    `Qualquer dúvida estarei à disposição!`;

      const link = `https://wa.me/55${whats}?text=${encodeURIComponent(texto)}`;
      window.open(link, '_blank');
    }

    function gerarPDF() {
      const elemento = document.getElementById('area-pdf');
      const nomeCliente = document.getElementById('nomeCliente').value || "Cliente";

      const opcoes = {
        margin: 10,
        filename: `Orcamento_${nomeCliente}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opcoes).from(elemento).save();
    }

    function mostrarTela(tela) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.add('hidden');
      document.getElementById('expired-section').classList.add('hidden');

      if (tela === 'auth') document.getElementById('auth-section').classList.remove('hidden');
      if (tela === 'app') document.getElementById('app-section').classList.remove('hidden');
      if (tela === 'expired') document.getElementById('expired-section').classList.remove('hidden');
    }
  </script>
</body>
</html>
